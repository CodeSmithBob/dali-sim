<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-label="Raspberry Pi pins 1 (3.3 V), 6 (ground), 11 (GPIO17, transmit) and 13 (GPIO27, receive) go to a DALI interface board; the board's DA plus and DA minus go to the DALI line."><style>
text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #16202a; }
.t-small { font-size: 11.5px; fill: #566573; }
.t-strong { font-weight: 600; }
.t-wire { fill: #7a3db8; font-weight: 600; }
.t-net { fill: #1e66a6; }
.box { fill: #ffffff; stroke: #16202a; stroke-width: 1.4; }
.frame { fill: none; stroke: #566573; stroke-width: 1.2; stroke-dasharray: 5 4; }
.wire { stroke: #7a3db8; stroke-width: 4; fill: none; }
.net { stroke: #1e66a6; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
.usb { stroke: #16202a; stroke-width: 2; fill: none; }
.ah-net { fill: #1e66a6; }
.ah { fill: #16202a; }
.dot { fill: #7a3db8; }
.lamp { fill: #f2c94c; stroke: #16202a; stroke-width: 1.2; }
</style><rect width="760" height="230" rx="12" fill="#f7f9fa"/>
          <rect class="box" x="20" y="24" width="190" height="180" rx="8"/>
          <text x="115" y="48" text-anchor="middle" class="t-strong">Raspberry Pi B</text>
          <text x="36" y="76">pin 1 · 3.3 V</text>
          <text x="36" y="106">pin 6 · GND</text>
          <text x="36" y="136">pin 11 · GPIO17 (TX)</text>
          <text x="36" y="166">pin 13 · GPIO27 (RX)</text>
          <circle cx="210" cy="72" r="4" class="ah"/><circle cx="210" cy="102" r="4" class="ah"/>
          <circle cx="210" cy="132" r="4" class="ah"/><circle cx="210" cy="162" r="4" class="ah"/>
          <line class="usb" x1="210" y1="72" x2="340" y2="72"/>
          <line class="usb" x1="210" y1="102" x2="340" y2="102"/>
          <line class="usb" x1="210" y1="132" x2="332" y2="132"/><polygon class="ah" points="340,132 330,126 330,138"/>
          <line class="usb" x1="218" y1="162" x2="340" y2="162"/><polygon class="ah" points="210,162 220,156 220,168"/>
          <rect class="box" x="340" y="24" width="190" height="180" rx="8"/>
          <text x="435" y="48" text-anchor="middle" class="t-strong">DALI interface board</text>
          <text x="435" y="64" text-anchor="middle" class="t-small">opto-isolated</text>
          <text x="352" y="76">VCC</text><text x="352" y="106">GND</text><text x="352" y="136">TX in</text><text x="352" y="166">RX out</text>
          <line class="wire" x1="530" y1="92" x2="740" y2="92"/>
          <line class="wire" x1="530" y1="142" x2="740" y2="142"/>
          <text x="620" y="84" text-anchor="middle" class="t-wire">DA+</text>
          <text x="620" y="134" text-anchor="middle" class="t-wire">DA−</text>
          <text x="740" y="176" text-anchor="end" class="t-small">to the DALI line and bus power supply</text>
        </svg>
